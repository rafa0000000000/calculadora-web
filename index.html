<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- deixa a pagina boa no celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora</title>
  <!-- liga o css -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- caixa da calculadora -->
  <div class="calculadora">

    <!-- botao do tema -->
    <button class="tema" onclick="alternarTema()">Tema claro/escuro</button>

    <!-- visor onde aparecem os numeros -->
    <div id="visor">0</div>

    <!-- botoes (cada um chama uma funcao do js) -->
    <div class="teclas">
      <button onclick="limpar()">C</button>
      <button onclick="apagar()">⌫</button>
      <button onclick="porcentagem()">%</button>
      <button onclick="operacao('/')">÷</button>

      <button onclick="digitar('7')">7</button>
      <button onclick="digitar('8')">8</button>
      <button onclick="digitar('9')">9</button>
      <button onclick="operacao('*')">×</button>

      <button onclick="digitar('4')">4</button>
      <button onclick="digitar('5')">5</button>
      <button onclick="digitar('6')">6</button>
      <button onclick="operacao('-')">−</button>

      <button onclick="digitar('1')">1</button>
      <button onclick="digitar('2')">2</button>
      <button onclick="digitar('3')">3</button>
      <button onclick="operacao('+')">+</button>

      <button onclick="raiz()">√</button>
      <button onclick="digitar('0')">0</button>
      <button onclick="ponto()">,</button>
      <button class="igual" onclick="calcular()">=</button>
    </div>

    <!-- historico das contas -->
    <div class="historico">
      <h3>Histórico</h3>
      <ul id="lista"></ul>
      <button onclick="limparHistorico()">Limpar histórico</button>
    </div>
  </div>

  <!-- liga o javascript -->
  <script src="script.js"></script>
</body>
</html>
